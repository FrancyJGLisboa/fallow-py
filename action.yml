name: "fallow-py"
description: "Unified Python codebase intelligence: module reachability, circular dependencies, and import/dependency hygiene."
branding:
  icon: "search"
  color: "green"

inputs:
  path:
    description: "Project root to analyze."
    default: "."
  extras:
    description: "Optional extras to install (e.g. 'adapters' for deptry/radon/import-linter). Empty for core only."
    default: "adapters"
  version:
    description: "fallow-py version spec appended to the package name (e.g. '==0.1.0'). Empty installs the latest."
    default: ""
  python-version:
    description: "Python version to set up."
    default: "3.12"
  fail-on-error:
    description: "Fail the job when error-severity issues are found."
    default: "true"
  upload-sarif:
    description: "Upload results to GitHub Code Scanning (needs 'security-events: write' permission)."
    default: "true"

outputs:
  exit-code:
    description: "fallow-py exit code (1 = error-severity issues found, 0 = clean)."
    value: ${{ steps.run.outputs.exit_code }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install fallow-py
      shell: bash
      run: |
        pkg="fallow-py${{ inputs.version }}"
        if [ -n "${{ inputs.extras }}" ]; then
          pkg="fallow-py[${{ inputs.extras }}]${{ inputs.version }}"
        fi
        python -m pip install --upgrade pip
        python -m pip install "$pkg"

    - name: Run fallow-py
      id: run
      shell: bash
      run: |
        set +e
        fallow-py --no-color --format compact "${{ inputs.path }}"
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        # SARIF goes to a file for upload; never let it fail the step here.
        fallow-py --format sarif "${{ inputs.path }}" > fallow.sarif || true

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: fallow.sarif

    - name: Enforce result
      if: ${{ inputs.fail-on-error == 'true' && steps.run.outputs.exit_code != '0' }}
      shell: bash
      run: |
        echo "::error::fallow-py found error-severity issues"
        exit 1
