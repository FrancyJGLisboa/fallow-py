# Example: run fallow-py on every PR and surface findings in GitHub Code Scanning.
# Copy into .github/workflows/ in your own project.
name: fallow-py

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write  # required for SARIF upload

jobs:
  fallow-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FrancyJGLisboa/fallow-py@v0   # pin to a release tag in real use
        with:
          path: "."
          extras: "adapters"
          fail-on-error: "true"
